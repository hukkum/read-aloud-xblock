<div class="pte-edit-container">
  <h2>PTE Read Aloud – Settings</h2>

  <form class="pte-edit-form">
    <div class="field">
      <label>Title (display name)</label>
      <input type="text"
             name="display_name"
             class="input input-large"
             value="{self.display_name}" />
    </div>

    <div class="field">
      <label>Instructions (shown above the text)</label>
      <textarea name="instructions"
                class="input input-full"
                rows="3">{self.instructions}</textarea>
    </div>

    <div class="field">
      <label>Reference text (student will read this)</label>
      <textarea name="reference_text"
                class="input input-full"
                rows="4">{self.reference_text}</textarea>
    </div>

    <div class="field">
      <label>Scoring API URL</label>
      <input type="text"
             name="api_url"
             class="input input-full"
             value="{self.api_url}" />
      <p class="helptext">
        Typically your Flask backend endpoint, e.g. <code>https://api.abroadprocess.com/api/pte/read-aloud</code>.
      </p>
    </div>

    <div class="field">
      <label>Weight (points in gradebook, 0–90 recommended)</label>
      <input type="number"
             name="weight"
             class="input"
             step="0.1"
             value="{self.weight}" />
    </div>

    <div class="pte-edit-actions">
      <button type="submit" class="action action-primary">Save</button>
      <button type="button" class="action action-secondary pte-edit-cancel">Cancel</button>
    </div>

    <div class="pte-edit-status"></div>
  </form>
</div>
