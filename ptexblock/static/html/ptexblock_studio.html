<div class="pte-container pte-studio">
  <h2>Studio – PTE Read Aloud (Single)</h2>

  <div class="pte-field">
    <label for="pte-title"><strong>Title</strong></label><br/>
    <input type="text"
           id="pte-title"
           value="{self.display_name}"
           style="width: 100%;" />
  </div>

  <div class="pte-field" style="margin-top: 10px;">
    <label for="pte-instructions"><strong>Instructions</strong></label><br/>
    <textarea id="pte-instructions"
              rows="3"
              style="width: 100%;">{self.instructions}</textarea>
  </div>

  <div class="pte-field" style="margin-top: 10px;">
    <label for="pte-reference-text"><strong>Reference text</strong></label><br/>
    <textarea id="pte-reference-text"
              rows="3"
              style="width: 100%;">{self.reference_text}</textarea>
  </div>

  <div class="pte-field" style="margin-top: 10px;">
    <label for="pte-api-url"><strong>Scoring API URL</strong></label><br/>
    <input type="text"
           id="pte-api-url"
           value="{self.api_url}"
           style="width: 100%;" />
  </div>

  <button id="pte-save-settings" style="margin-top: 12px;">
    Save
  </button>

  <p id="pte-save-status" style="margin-top: 8px; font-style: italic;">
  </p>
</div>
