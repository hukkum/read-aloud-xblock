<div class="pte-read-aloud-block">
  <h2 class="pte-title">{self.title}</h2>

  <p class="pte-instructions">
    {self.instructions}
  </p>

  <p><strong>Read the following text aloud:</strong></p>
  <p class="pte-reference-text">{self.reference_text}</p>

  <div class="pte-recorder">
    <button class="pte-start">🎤 Start Recording</button>
    <button class="pte-stop" disabled>⏹ Stop</button>
  </div>

  <div class="pte-status">
    <span class="pte-status-message">
      Click "Start Recording" to begin.
    </span>
  </div>

  <div class="pte-last-score">
    Last saved pronunciation score (0–90): <span class="pte-score-value">
      {self.student_score}
    </span>
  </div>
</div>
